name: harbor-mcp image

# Build the Harbor MCP server image from the pinned upstream commit in
# mcp/harbor-mcp/Dockerfile. PRs build only; merges to main push to GHCR, tagged
# with the short upstream commit (no `latest`).
on:
  push:
    branches: [main]
    paths:
      - 'mcp/harbor-mcp/Dockerfile'
      - '.github/workflows/harbor-mcp-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp/harbor-mcp/Dockerfile'
      - '.github/workflows/harbor-mcp-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/harbor-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tag from upstream commit
        id: tag
        run: |
          commit="$(sed -n 's/^ARG COMMIT=//p' mcp/harbor-mcp/Dockerfile)"
          echo "tag=${commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mcp/harbor-mcp
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
