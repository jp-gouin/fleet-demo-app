name: php2shell image

# Build the php2shell demo image. On pull requests touching the app we build only
# (validation, no push). On merge to main we build and push to GHCR, so the fix
# PR -> merge -> new image flow is automatic.
on:
  push:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/php2shell-demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (i.e. not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so we can read the installed PHP package revision out
      # of the image and derive the tag from it. Ubuntu reports PHP 8.3.6 for both
      # the vulnerable and patched builds, so the tag encodes the security state:
      #   8.3.6-vuln   (GA php8.3)
      #   8.3.6-fixed  (…24.04.13 php2shell security update)
      # No `latest`. The fix PR flips PATCH_STATE, which flips the tag, so the
      # Deployment pins to a distinct image and Fleet rolls out.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: cve/php2shell
          file: cve/php2shell/Dockerfile
          load: true
          tags: php2shell-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Derive tag from installed PHP package
        id: tag
        run: |
          pkg="$(docker run --rm php2shell-demo:ci cat /etc/php2shell.pkgver)"
          rev="$(printf '%s' "$pkg" | sed -n 's/.*0ubuntu0\.24\.04\.\([0-9]*\).*/\1/p')"
          if [ -n "$rev" ] && [ "$rev" -ge 13 ]; then state=fixed; else state=vuln; fi
          echo "pkg=$pkg"   >> "$GITHUB_OUTPUT"
          echo "tag=8.3.6-$state" >> "$GITHUB_OUTPUT"
          echo "Installed php8.3 package: $pkg -> ${IMAGE}:8.3.6-$state"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag php2shell-demo:ci "${IMAGE}:${{ steps.tag.outputs.tag }}"
          docker push "${IMAGE}:${{ steps.tag.outputs.tag }}"
