name: php2shell image

# Build the php2shell demo image. On pull requests touching the app we build only
# (validation, no push). On merge to main we build and push to GHCR, so the fix
# PR -> merge -> new image flow is automatic.
on:
  push:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/php2shell-demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (i.e. not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the image with the PHP version from the Dockerfile's FROM line, e.g.
      # `FROM php:8.3.35-apache` -> tag `8.3.35`. No `latest`: the tag tracks the
      # exact PHP runtime, so the fix PR (bump to 8.3.36) produces a new, distinct
      # image tag that the Deployment can pin to.
      - name: Derive PHP version tag
        id: ver
        run: |
          php_ver="$(sed -n 's/^FROM php:\([0-9.]*\).*/\1/p' cve/php2shell/Dockerfile | head -n1)"
          if [ -z "$php_ver" ]; then
            echo "Could not parse PHP version from Dockerfile FROM line" >&2
            exit 1
          fi
          echo "php=$php_ver" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE}:$php_ver"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cve/php2shell
          file: cve/php2shell/Dockerfile
          # Push on branch builds (merge to main); build-only on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.php }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.php }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
