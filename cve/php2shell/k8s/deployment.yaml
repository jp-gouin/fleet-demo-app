# php2shell-demo — vulnerable PHP app for CVE-2026-109618 / CVE-2026-109619 training.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php2shell-demo
  namespace: php2shell-demo
  labels:
    app: php2shell-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php2shell-demo
  template:
    metadata:
      labels:
        app: php2shell-demo
    spec:
      containers:
        - name: web
          # Rebuild + push after the fix PR (bump the Dockerfile PHP base image).
          image: ghcr.io/jp-gouin/php2shell-demo:8.3.36
          imagePullPolicy: Always
          ports:
            - containerPort: 80
