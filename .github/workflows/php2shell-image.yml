name: php2shell image

# Build the php2shell demo image. On pull requests touching the app we build only
# (validation, no push). On merge to main we build and push to GHCR, so the fix
# PR -> merge -> new image flow is automatic.
on:
  push:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cve/php2shell/**'
      - '.github/workflows/php2shell-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/php2shell-demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (i.e. not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cve/php2shell
          file: cve/php2shell/Dockerfile
          # Push on branch builds (merge to main); build-only on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
