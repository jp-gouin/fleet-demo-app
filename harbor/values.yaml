# Harbor on the lab-downstream cluster (chart harbor/harbor 1.19.4, Harbor 2.15.4).
#
#   helm upgrade --install harbor harbor/harbor --version 1.19.4 \
#     -n harbor -f harbor/values.yaml
#
# The admin password is NOT in this file. Create it first (see mcp/harbor-mcp/README.md):
#   kubectl -n harbor create secret generic harbor-admin \
#     --from-literal=HARBOR_ADMIN_PASSWORD='<password>'
expose:
  type: ingress
  tls:
    enabled: true
    # Self-signed cert generated by the chart (lab only).
    certSource: auto
  ingress:
    className: traefik
    hosts:
      core: harbor.10.144.103.243.sslip.io

externalURL: https://harbor.10.144.103.243.sslip.io

existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn
      size: 10Gi
    jobservice:
      jobLog:
        storageClass: longhorn
    database:
      storageClass: longhorn
    redis:
      storageClass: longhorn
    trivy:
      storageClass: longhorn

# Trivy is the scanner the MCP server's scan_* tools rely on.
trivy:
  enabled: true
